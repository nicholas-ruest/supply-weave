name: Product evidence
on: [push, pull_request]
permissions: { contents: read }
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.99.1', components: rustfmt,clippy }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cargo install cargo-deny --locked
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify exact product
        env: { DREAM_MACHINE_EVIDENCE_DIR: '${{ runner.temp }}/supply-weave-evidence' }
        run: bash scripts/verify-prototype.sh
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'supply-weave-evidence-${{ github.sha }}', path: '${{ runner.temp }}/supply-weave-evidence', if-no-files-found: error }
